# ==============================================================================
# Bahripay Maritime Management - Spring Boot Configuration
# ==============================================================================
spring.application.name=bahripay-backend
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bahripay_maritime}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL Schema & Initial Seed Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# JWT Security Settings (Override JWT_SECRET in production with a 256-bit Base64 secret)
app.jwt.secret=${JWT_SECRET:BahripayMaritimeSecureJwtSecretKey2026ConcarneauLorientSeteLaRochelle!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS Allowed Origins (Vite React Frontend)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}

# Multipart File Uploads (Administrative Sailor Documents)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.storage.documents-dir=${DOCUMENTS_DIR:./uploads/documents}

# Optional Server-Side Gemini AI Integration
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-4-hydrogen}
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# Logging
logging.level.com.maritime=INFO
logging.level.org.springframework.security=INFO
